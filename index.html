<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dannie | Social Links</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family: system-ui, sans-serif;}
        body{background:#111;color:#fff;padding:40px 20px;text-align:center;min-height:100vh;}
        .container{max-width:420px;margin:0 auto;}
        .avatar{width:110px;height:110px;border-radius:50%;object-fit:cover;margin-bottom:16px;border:2px solid #333;}
        h1{font-size:24px;margin-bottom:8px;}
        .bio{color:#aaa;margin-bottom:32px;font-size:15px;}
        .link-item{display:block;background:#222;color:#fff;text-decoration:none;padding:16px;border-radius:12px;margin-bottom:14px;font-size:16px;transition:0.2s;}
        .link-item:hover{background:#333;transform:translateY(-2px);}
    </style>
</head>
<body>
    <div class="container">
        <!-- 头像：把图片地址替换在这里，不填也没关系 -->
        <!-- <img class="avatar" src="你的头像链接"> -->
        <h1>Dannie</h1>
        <p class="bio">Find me on social media</p>
        <a class="link-item" href="https://www.tiktok.com/@dannie8260?_r=1&_t=ZP-99uFW8lHw9X" target="_blank">TikTok</a>
        <a class="link-item" href="https://www.instagram.com/dannie74662?stkn=a2J6bXlmMm44cmx1" target="_blank">Instagram</a>
        <a class="link-item" href="https://youtube.com/@helgajasraui?si=X1yWlUHaIEz1WdaN" target="_blank">YouTube</a>
        <a class="link-item" href="https://www.facebook.com/share/1P6qhUSc85/" target="_blank">Facebook</a>
        <a class="link-item" href="https://wa.me/8615361787164" target="_blank">WhatsApp Chat</a>

        <a href="javascript:document.getElementById('wechatModal').style.display='block';" class="link-item">Show WeChat QR Code</a>

        <div id="wechatModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:999;text-align:center;padding-top:50px;">
          <span onclick="document.getElementById('wechatModal').style.display='none'" style="position:absolute;top:20px;right:30px;color:white;font-size:30px;cursor:pointer;">&times;</span>
          <img src="wechat-qr.png" style="max-width:80%;">
          <p style="color:#fff;margin-top:16px;">Long press QR code to add WeChat</p>
        </div>
    </div>
</body>
</html>
